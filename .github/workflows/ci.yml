name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * *" # nightly check of the real DGT feed

jobs:
  check:
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - name: Install linters
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Check (make)
        if: runner.os != 'Windows'
        run: make check
      - name: Check (bash, no make on Windows runners)
        if: runner.os == 'Windows'
        run: bash scripts/check.sh

  # Review gate (docs/ARRANQUE.md §10.5, §12): a PR that names a task ID must
  # carry its review report. Informational for reviewers and blocking for the
  # PR; the build jobs deliberately do not depend on it.
  review-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Review report gate
        # The PR title is attacker-controlled text. Interpolating it directly
        # into `run:` would let a title like $(curl ...|sh) execute in the
        # runner before the script ever sees it, so it travels via env and is
        # referenced as a quoted shell variable instead.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/require_review.sh "$PR_TITLE"

  live:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - name: Live feed test
        run: TRAFICO_LIVE=1 go test -tags live ./...
